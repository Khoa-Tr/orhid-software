; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>

lib_deps =
	adafruit/DHT sensor library
	adafruit/Adafruit Unified Sensor
	knolleary/PubSubClient
	bblanchon/ArduinoJson

[env:esp32dev_timer_test]
extends = env:esp32dev
build_flags = -D ORCHID_TIMER_TEST

; Chi dung cho scenario Wokwi tuan 7: timer rut ngan + lenh Serial "FAULT ..." gia lap loi.
; Khong nap ban nay vao ESP32 that.
[env:esp32dev_fault_test]
extends = env:esp32dev
build_flags = -D ORCHID_TIMER_TEST -D ORCHID_FAULT_INJECTION

[env:s3_physical]
extends = env:esp32dev
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_src_filter = +<s3_physical.cpp>
lib_deps =
    ${env:esp32dev.lib_deps}
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3_display_test]
extends = env:s3_physical
build_src_filter = +<s3_display_test.cpp>

[env:s3_sensor_test]
extends = env:s3_physical
build_src_filter = +<s3_sensor_test.cpp>

[env:s3_pin_test]
extends = env:s3_physical
build_src_filter = +<s3_pin_test.cpp>

[env:s3_relay_test]
extends = env:s3_physical
build_src_filter = +<s3_relay_test.cpp>

[env:s3_mist_relay_test]
extends = env:s3_physical
build_src_filter = +<s3_mist_relay_test.cpp>

[env:s3_light_test]
extends = env:s3_physical
build_src_filter = +<s3_light_test.cpp>
