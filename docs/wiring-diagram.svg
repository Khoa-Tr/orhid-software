<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Sơ đồ đấu dây Wokwi (diagram.json)</title>
  <rect width="1100" height="730" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Sơ đồ đấu dây mô phỏng Wokwi (diagram.json) — ESP32 DevKit V1</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#334155">Vẽ lại từ mục "connections" của diagram.json · cảm biến nuôi 3V3, relay nuôi VIN (5 V) · mọi GND nối chân GND.1</text>

  <!-- Bus nguon ben trai: 3V3 va GND -->
  <g stroke-width="2.5" fill="none">
    <polyline points="440,135 355,135 355,460" stroke="#dc2626"/>
    <line x1="310" y1="160" x2="355" y2="160" stroke="#dc2626"/>
    <line x1="310" y1="310" x2="355" y2="310" stroke="#dc2626"/>
    <line x1="310" y1="460" x2="355" y2="460" stroke="#dc2626"/>
    <line x1="385" y1="220" x2="385" y2="640" stroke="#111827"/>
    <line x1="310" y1="220" x2="385" y2="220" stroke="#111827"/>
    <line x1="310" y1="370" x2="385" y2="370" stroke="#111827"/>
    <line x1="310" y1="520" x2="385" y2="520" stroke="#111827"/>
    <!-- Bus nguon ben phai: VIN va GND -->
    <polyline points="660,135 745,135 745,460" stroke="#dc2626"/>
    <line x1="745" y1="160" x2="790" y2="160" stroke="#dc2626"/>
    <line x1="745" y1="310" x2="790" y2="310" stroke="#dc2626"/>
    <line x1="745" y1="460" x2="790" y2="460" stroke="#dc2626"/>
    <line x1="715" y1="220" x2="715" y2="640" stroke="#111827"/>
    <line x1="715" y1="220" x2="790" y2="220" stroke="#111827"/>
    <line x1="715" y1="370" x2="790" y2="370" stroke="#111827"/>
    <line x1="715" y1="520" x2="790" y2="520" stroke="#111827"/>
    <!-- Ray GND chung -->
    <polyline points="385,640 715,640" stroke="#111827"/>
    <line x1="550" y1="590" x2="550" y2="640" stroke="#111827"/>
    <!-- Tin hieu cam bien (vao ESP32) -->
    <line x1="310" y1="190" x2="440" y2="190" stroke="#16a34a" stroke-width="3"/>
    <line x1="310" y1="340" x2="440" y2="340" stroke="#16a34a" stroke-width="3"/>
    <line x1="310" y1="490" x2="440" y2="490" stroke="#16a34a" stroke-width="3"/>
    <!-- Dieu khien relay (ra tu ESP32) -->
    <line x1="660" y1="190" x2="790" y2="190" stroke="#2563eb" stroke-width="3"/>
    <line x1="660" y1="340" x2="790" y2="340" stroke="#2563eb" stroke-width="3"/>
    <line x1="660" y1="490" x2="790" y2="490" stroke="#2563eb" stroke-width="3"/>
  </g>
  <g fill="#dc2626">
    <circle cx="355" cy="160" r="4"/><circle cx="355" cy="310" r="4"/>
    <circle cx="745" cy="160" r="4"/><circle cx="745" cy="310" r="4"/>
  </g>
  <g fill="#111827">
    <circle cx="385" cy="370" r="4"/><circle cx="385" cy="520" r="4"/>
    <circle cx="715" cy="370" r="4"/><circle cx="715" cy="520" r="4"/>
    <circle cx="550" cy="640" r="4"/>
  </g>
  <text x="400" y="632" font-size="12" fill="#111827">GND chung</text>

  <!-- ESP32 -->
  <rect x="440" y="110" width="220" height="480" rx="10" fill="#1e293b" stroke="#0f172a"/>
  <text x="550" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#f8fafc">ESP32</text>
  <text x="550" y="292" text-anchor="middle" font-size="13" fill="#cbd5e1">DevKit V1 (id: esp)</text>
  <text x="550" y="410" text-anchor="middle" font-size="12" fill="#cbd5e1">firmware: src/main.cpp</text>
  <text x="550" y="428" text-anchor="middle" font-size="12" fill="#cbd5e1">Serial 115200 baud</text>
  <g font-size="13" font-weight="700" fill="#f8fafc">
    <text x="450" y="140">3V3</text>
    <text x="450" y="195">D15</text>
    <text x="450" y="345">D34</text>
    <text x="450" y="495">D35</text>
    <text x="650" y="140" text-anchor="end">VIN</text>
    <text x="650" y="195" text-anchor="end">D25</text>
    <text x="650" y="345" text-anchor="end">D26</text>
    <text x="650" y="495" text-anchor="end">D27</text>
    <text x="550" y="580" text-anchor="middle">GND.1</text>
  </g>

  <!-- Cam bien -->
  <g font-size="12" fill="#334155">
    <rect x="60" y="130" width="250" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="74" y="152" font-size="14" font-weight="700" fill="#0f172a">DHT22 (id: dht)</text>
    <text x="74" y="172">Nhiệt độ + độ ẩm, 1 dây dữ liệu</text>
    <text x="74" y="190">Giá trị đầu: 28 °C, 72 %</text>
    <text x="74" y="208">→ Pins::dht = 15</text>
    <text x="300" y="164" text-anchor="end" font-weight="700" fill="#dc2626">VCC</text>
    <text x="300" y="194" text-anchor="end" font-weight="700" fill="#16a34a">SDA</text>
    <text x="300" y="224" text-anchor="end" font-weight="700" fill="#111827">GND</text>

    <rect x="60" y="280" width="250" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="74" y="302" font-size="14" font-weight="700" fill="#0f172a">Quang trở (id: ldr)</text>
    <text x="74" y="322">Module LDR, ngõ ra analog AO</text>
    <text x="74" y="340">Giá trị đầu: 250 lux</text>
    <text x="74" y="358">→ Pins::ldr = 34 (tối: ADC cao)</text>
    <text x="300" y="314" text-anchor="end" font-weight="700" fill="#dc2626">VCC</text>
    <text x="300" y="344" text-anchor="end" font-weight="700" fill="#16a34a">AO</text>
    <text x="300" y="374" text-anchor="end" font-weight="700" fill="#111827">GND</text>

    <rect x="60" y="430" width="250" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="74" y="452" font-size="14" font-weight="700" fill="#0f172a">Biến trở mực nước (id: water)</text>
    <text x="74" y="472">Mô phỏng cảm biến mực nước</text>
    <text x="74" y="490">Giá trị đầu: 820/1023 (đủ nước)</text>
    <text x="74" y="508">→ Pins::water = 35 (cạn: ADC thấp)</text>
    <text x="300" y="464" text-anchor="end" font-weight="700" fill="#dc2626">VCC</text>
    <text x="300" y="494" text-anchor="end" font-weight="700" fill="#16a34a">SIG</text>
    <text x="300" y="524" text-anchor="end" font-weight="700" fill="#111827">GND</text>
  </g>

  <!-- Relay -->
  <g font-size="12" fill="#334155">
    <rect x="790" y="130" width="250" height="110" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="840" y="152" font-size="14" font-weight="700" fill="#0f172a">Relay phun sương</text>
    <text x="840" y="172">id: mistRelay, transistor pnp</text>
    <text x="840" y="190">IN HIGH → COM nối NO (bật)</text>
    <text x="840" y="208">← Pins::mistRelay = 25</text>
    <text x="800" y="164" font-weight="700" fill="#dc2626">VCC</text>
    <text x="800" y="194" font-weight="700" fill="#2563eb">IN</text>
    <text x="800" y="224" font-weight="700" fill="#111827">GND</text>

    <rect x="790" y="280" width="250" height="110" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="840" y="302" font-size="14" font-weight="700" fill="#0f172a">Relay quạt</text>
    <text x="840" y="322">id: fanRelay, transistor pnp</text>
    <text x="840" y="340">IN HIGH → COM nối NO (bật)</text>
    <text x="840" y="358">← Pins::fanRelay = 26</text>
    <text x="800" y="314" font-weight="700" fill="#dc2626">VCC</text>
    <text x="800" y="344" font-weight="700" fill="#2563eb">IN</text>
    <text x="800" y="374" font-weight="700" fill="#111827">GND</text>

    <rect x="790" y="430" width="250" height="110" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="840" y="452" font-size="14" font-weight="700" fill="#0f172a">Relay đèn trồng cây</text>
    <text x="840" y="472">id: lightRelay, transistor pnp</text>
    <text x="840" y="490">IN HIGH → COM nối NO (bật)</text>
    <text x="840" y="508">← Pins::lightRelay = 27</text>
    <text x="800" y="464" font-weight="700" fill="#dc2626">VCC</text>
    <text x="800" y="494" font-weight="700" fill="#2563eb">IN</text>
    <text x="800" y="524" font-weight="700" fill="#111827">GND</text>
  </g>

  <!-- Chu giai -->
  <g font-size="12.5" fill="#334155">
    <line x1="110" y1="690" x2="150" y2="690" stroke="#dc2626" stroke-width="3"/><text x="158" y="694">Nguồn (3V3 / VIN)</text>
    <line x1="310" y1="690" x2="350" y2="690" stroke="#111827" stroke-width="3"/><text x="358" y="694">GND</text>
    <line x1="430" y1="690" x2="470" y2="690" stroke="#16a34a" stroke-width="3"/><text x="478" y="694">Tín hiệu cảm biến → ESP32</text>
    <line x1="680" y1="690" x2="720" y2="690" stroke="#2563eb" stroke-width="3"/><text x="728" y="694">ESP32 → chân IN relay</text>
    <circle cx="920" cy="690" r="4" fill="#111827"/><text x="930" y="694">điểm nối</text>
  </g>
</svg>
