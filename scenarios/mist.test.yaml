name: 'Orchid week 3 - mist by humidity'
version: 1
author: 'orhid'
# Tach tu mist-water.test.yaml de moi phien Wokwi CI duoi 5 phut (gioi han goi mien phi).

steps:
  - wait-serial: 'Orchid garden controller started'
  - set-control: { part-id: dht, control: temperature, value: 28 }
  - set-control: { part-id: dht, control: humidity, value: 72 }
  - set-control: { part-id: ldr, control: lux, value: 1000 }
  - set-control: { part-id: water, control: position, value: 0.6 }
  - delay: 15000ms
  - wait-serial: 'Mist: IDLE | Fan: OFF | Grow light: OFF'
  # A1-A4: do am thap thi phun, vung tre giu nguyen, du am thi dung
  - set-control: { part-id: dht, control: humidity, value: 60 }
  - wait-serial: 'STATE mist IDLE -> RUNNING'
  - wait-serial: 'Mist: RUNNING | Fan: OFF | Grow light: OFF'
  - set-control: { part-id: dht, control: humidity, value: 72 }
  - delay: 15000ms
  - wait-serial: 'Mist: RUNNING | Fan: OFF | Grow light: OFF'
  - set-control: { part-id: dht, control: humidity, value: 82 }
  - wait-serial: 'STATE mist RUNNING -> IDLE'
  - set-control: { part-id: dht, control: humidity, value: 72 }
  - delay: 15000ms
  - wait-serial: 'Mist: IDLE | Fan: OFF | Grow light: OFF'
