name: 'Orchid week 3 - light'
version: 1
author: 'orhid'
# Tach tu fan-light.test.yaml de moi phien Wokwi CI duoi 5 phut (gioi han goi mien phi).

steps:
  - wait-serial: 'Orchid garden controller started'
  - set-control: { part-id: dht, control: temperature, value: 28 }
  - set-control: { part-id: dht, control: humidity, value: 72 }
  - set-control: { part-id: ldr, control: lux, value: 1000 }
  - set-control: { part-id: water, control: position, value: 0.6 }
  - delay: 15000ms
  - wait-serial: 'Mist: IDLE | Fan: OFF | Grow light: OFF'
  # D1-D3: troi toi bat den, vung tre giu nguyen, du sang thi tat
  - set-control: { part-id: ldr, control: lux, value: 10 }
  - wait-serial: 'STATE light -> ON'
  - set-control: { part-id: ldr, control: lux, value: 110 }
  - delay: 15000ms
  - wait-serial: 'Grow light: ON'
  - set-control: { part-id: ldr, control: lux, value: 1000 }
  - wait-serial: 'STATE light -> OFF'
