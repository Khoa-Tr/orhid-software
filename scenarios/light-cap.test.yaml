name: 'Orchid week 7 - light AUTO on-time cap'
version: 1
author: 'orhid'
# Chay voi build esp32dev_fault_test (den AUTO toi da 20 s).
# Tach tu safety-faults.test.yaml (buoc S5) de moi phien Wokwi CI duoi 5 phut (gioi han goi mien phi).

steps:
  - wait-serial: 'Orchid garden controller started'
  - set-control: { part-id: dht, control: temperature, value: 28 }
  - set-control: { part-id: dht, control: humidity, value: 72 }
  - set-control: { part-id: ldr, control: lux, value: 1000 }
  - set-control: { part-id: water, control: position, value: 0.6 }
  - delay: 15000ms
  - wait-serial: 'Mist: IDLE | Fan: OFF | Grow light: OFF'
  # S5: den AUTO cuc bo khong bat qua gioi han, chi bat lai sau khi thay troi sang
  - set-control: { part-id: ldr, control: lux, value: 10 }
  - wait-serial: 'STATE light -> ON'
  - wait-serial: 'SAFETY light AUTO on-time limit reached'
  - wait-serial: 'STATE light -> OFF'
  - delay: 10000ms
  - wait-serial: 'Grow light: OFF'
  - set-control: { part-id: ldr, control: lux, value: 1000 }
  - delay: 15000ms
  - set-control: { part-id: ldr, control: lux, value: 10 }
  - wait-serial: 'STATE light -> ON'
