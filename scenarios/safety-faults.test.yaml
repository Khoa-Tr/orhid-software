name: 'Orchid week 7 - DHT fault, water lockout and recovery'
version: 1
author: 'orhid'

# Chay voi build esp32dev_fault_test (phun 15 s, cooldown 10 s).
# Buoc S5 (gioi han thoi gian bat den AUTO) nam o light-cap.test.yaml de moi phien Wokwi CI duoi 5 phut.
# Loi DHT duoc gia lap bang lenh Serial chi co trong build test.
steps:
  - wait-serial: 'Orchid garden controller started'
  - set-control: { part-id: dht, control: temperature, value: 28 }
  - set-control: { part-id: dht, control: humidity, value: 72 }
  - set-control: { part-id: ldr, control: lux, value: 1000 }
  - set-control: { part-id: water, control: position, value: 0.6 }
  - delay: 15000ms
  - wait-serial: 'Mist: IDLE | Fan: OFF | Grow light: OFF'

  # S1: dang phun AUTO thi DHT loi 3 lan lien tiep -> SENSOR_FAULT, relay phun tat ngay
  - set-control: { part-id: dht, control: humidity, value: 60 }
  - wait-serial: 'STATE mist IDLE -> RUNNING'
  - write-serial: "FAULT DHT ON\n"
  - wait-serial: 'TEST fault injection: FAULT DHT ON'
  - wait-serial: 'DHT22 read failed (1 consecutive)'
  - wait-serial: 'FAULT DHT22 3 consecutive read failures'
  - wait-serial: 'STATE mist RUNNING -> SENSOR_FAULT'
  - wait-serial: 'OUTPUT mist=OFF'

  # S2: van giu SENSOR_FAULT, khong tu phun lai du RH cuoi cung thap
  - delay: 10000ms
  - wait-serial: 'Mist: SENSOR_FAULT | Fan: OFF'

  # S3: nuoc thap trong luc DHT loi -> khoa nuoc uu tien; do nuoc lai -> quay ve SENSOR_FAULT
  - set-control: { part-id: water, control: position, value: 0.1 }
  - wait-serial: 'STATE mist SENSOR_FAULT -> WATER_LOCKOUT'
  - set-control: { part-id: water, control: position, value: 0.6 }
  - wait-serial: 'STATE mist WATER_LOCKOUT -> IDLE'
  - wait-serial: 'STATE mist IDLE -> SENSOR_FAULT'

  # S4: DHT hoi phuc -> cooldown mot chu ky roi moi phun AUTO lai
  - write-serial: "FAULT DHT OFF\n"
  - wait-serial: 'RECOVERED DHT22 readings valid again'
  - wait-serial: 'STATE mist SENSOR_FAULT -> COOLDOWN'
  - wait-serial: 'STATE mist COOLDOWN -> IDLE'
  - wait-serial: 'STATE mist IDLE -> RUNNING'
